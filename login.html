<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../data.js"></script>
<script src="../theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Abdul Rafay Portfolio</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- Ambient drifting background -->
<div class="ambient" aria-hidden="true">
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="blob blob--3"></div>
  <div class="blob blob--4"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="admin-login-page">
  <div class="admin-login-box reveal in-view">
    <div class="admin-login-logo">
      <a href="../index.html" class="logo" style="justify-content:center;">ABDUL<span class="dot">.</span>RAFAY</a>
    </div>
    <h1 class="admin-login-title">Admin Panel</h1>
    <p class="admin-login-sub">Sign in to manage your website content</p>

    <div class="admin-error" id="loginError">Incorrect email or password. Please try again.</div>

    <form id="loginForm" novalidate>
      <div class="admin-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="admin-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary form-submit" id="loginSubmitBtn" style="border:none;">
        Log In
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </form>

    <div class="admin-hint">
      Sign in with the admin email and password you created in Supabase.
    </div>
  </div>
</div>

<script>
  (function(){
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmitBtn');

    // If already logged in this session, skip straight to dashboard
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'dashboard.html';
    });

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      errorBox.classList.remove('show');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      submitBtn.disabled = true;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      submitBtn.disabled = false;

      if (error) {
        errorBox.textContent = error.message || 'Incorrect email or password. Please try again.';
        errorBox.classList.add('show');
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  })();
</script>

</body>
</html>
